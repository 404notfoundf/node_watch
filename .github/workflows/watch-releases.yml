name: Watch upstream releases

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: watch-upstream-releases
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Review new GitHub Releases
        id: review
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          NOTIFY_LOGINS: ${{ vars.NOTIFY_LOGINS }}
        run: python .github/scripts/watch_releases.py
      - name: Upload full report
        id: upload
        if: always() && steps.review.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: upstream-release-report
          path: ${{ steps.review.outputs.report_path }}
          if-no-files-found: ignore
          retention-days: 90
      - name: Create release summary Issue
        if: steps.review.outputs.issue_title != '' && steps.upload.outputs.artifact-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.review.outputs.issue_title }}
          ISSUE_BODY_FILE: ${{ steps.review.outputs.issue_body_path }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          python -c 'from pathlib import Path; import os; p=Path(os.environ["ISSUE_BODY_FILE"]); p.write_text(p.read_text(encoding="utf-8").replace("{{artifact_url}}", os.environ["ARTIFACT_URL"]), encoding="utf-8")'
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$ISSUE_BODY_FILE"
      - name: Mark incomplete release checks
        if: steps.review.outputs.failure_count != '0' && steps.review.outputs.failure_count != ''
        run: |
          echo "::error::Some release checks failed. They remain unrecorded and will be retried on the next poll. See the review step logs."
          exit 1
