name: 节点版本审查

on:
  workflow_dispatch:

concurrency:
  group: watch-upstream-releases
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      report_path: ${{ steps.review.outputs.report_path }}
      issue_title: ${{ steps.review.outputs.issue_title }}
      issue_body_base64: ${{ steps.review.outputs.issue_body_base64 }}
      failure_count: ${{ steps.review.outputs.failure_count }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Restore report history
        env:
          PAGES_HISTORICAL_REPORTS_DIR: ${{ runner.temp }}/pages-history/release-reports/reports
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            mkdir -p "$PAGES_HISTORICAL_REPORTS_DIR"
            while IFS= read -r path; do
              case "$path" in
                release-reports/reports/*/report.md)
                  relative="${path#release-reports/reports/}"
                  report_id="${relative%/report.md}"
                  if [[ "$report_id" =~ ^[0-9]+-[0-9]+$ ]]; then
                    mkdir -p "$PAGES_HISTORICAL_REPORTS_DIR/$report_id"
                    git show "FETCH_HEAD:$path" > "$PAGES_HISTORICAL_REPORTS_DIR/$relative"
                  fi
                  ;;
              esac
            done < <(git ls-tree -r --name-only FETCH_HEAD -- release-reports/reports)
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore review checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .release-review-cache
          key: release-review-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            release-review-cache-v1-
      - name: Review new GitHub Releases
        id: review
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          NOTIFY_LOGINS: ${{ vars.NOTIFY_LOGINS }}
          PAGES_HISTORICAL_REPORTS_DIR: ${{ runner.temp }}/pages-history/release-reports/reports
        run: python .github/scripts/watch_releases.py
      - name: Save review checkpoints
        if: always() && hashFiles('.release-review-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .release-review-cache
          key: release-review-cache-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload full report
        id: upload
        if: always() && steps.review.outputs.report_path != ''
        uses: actions/upload-artifact@v7
        with:
          name: upstream-release-report
          path: ${{ steps.review.outputs.report_path }}
          if-no-files-found: ignore
          retention-days: 90
      - name: Mark incomplete release checks
        if: steps.review.outputs.failure_count != '0' && steps.review.outputs.failure_count != ''
        run: |
          echo "::error::Some release checks failed. They remain unrecorded and will be retried on the next poll. See the review step logs."
          exit 1

  publish-report:
    needs: watch
    if: always() && needs.watch.outputs.report_path != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download full report
        uses: actions/download-artifact@v8
        with:
          name: upstream-release-report
          path: ${{ runner.temp }}/upstream-release-report
      - name: Restore Pages history
        env:
          PAGES_DIR: ${{ runner.temp }}/upstream-release-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add -b gh-pages "$PAGES_DIR" FETCH_HEAD
          else
            git worktree add --detach "$PAGES_DIR" HEAD
            git -C "$PAGES_DIR" switch --orphan gh-pages
          fi
      - name: Render report website
        id: render
        env:
          PAGES_DIR: ${{ runner.temp }}/upstream-release-pages
          REPORT_DIR: ${{ runner.temp }}/upstream-release-report
          REPORT_RETENTION_DAYS: '180'
        run: |
          report_path="$(python .github/scripts/publish_report_site.py \
            --report-dir "$REPORT_DIR" \
            --site-dir "$PAGES_DIR" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --retention-days "$REPORT_RETENTION_DAYS")"
          echo "report_path=$report_path" >> "$GITHUB_OUTPUT"
      - name: Save Pages history
        env:
          PAGES_DIR: ${{ runner.temp }}/upstream-release-pages
        run: |
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add --all
          git -C "$PAGES_DIR" commit -m "Publish upstream release report $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git -C "$PAGES_DIR" push origin gh-pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/upstream-release-pages
      - name: Wait for Pages artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..10}; do
            if artifact_count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq ".artifacts | map(select(.name == \"$PAGES_ARTIFACT_NAME\" and .expired == false)) | length" 2>/dev/null)"; then
              if [[ "$artifact_count" == "1" ]]; then
                echo "Pages artifact is visible to the deployment API."
                exit 0
              fi
              if [[ "$artifact_count" != "0" ]]; then
                echo "::error::Expected one Pages artifact named $PAGES_ARTIFACT_NAME, found $artifact_count."
                exit 1
              fi
            fi
            echo "Pages artifact is not visible yet (attempt $attempt/10)."
            sleep 2
          done
          echo "::error::Pages artifact $PAGES_ARTIFACT_NAME did not become visible after 20 seconds."
          exit 1
      - name: Deploy report website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
        continue-on-error: true
      - name: Add report link to Actions summary
        if: steps.deployment.outputs.page_url != ''
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_PATH: ${{ steps.render.outputs.report_path }}
          ARTIFACT_URL: ${{ needs.watch.outputs.artifact_url }}
        run: |
          report_url="${PAGE_URL%/}/$REPORT_PATH"
          echo "## Release report" >> "$GITHUB_STEP_SUMMARY"
          echo "[在线阅读完整报告](${report_url})" >> "$GITHUB_STEP_SUMMARY"
          echo "[下载 Markdown Artifact](${ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
      - name: Create release summary Issue
        if: always() && needs.watch.outputs.issue_title != '' && needs.watch.outputs.artifact_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ needs.watch.outputs.issue_title }}
          ISSUE_BODY_BASE64: ${{ needs.watch.outputs.issue_body_base64 }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_PATH: ${{ steps.render.outputs.report_path }}
          ARTIFACT_URL: ${{ needs.watch.outputs.artifact_url }}
        run: |
          python -c 'from pathlib import Path; import base64,os; p=Path(os.environ["RUNNER_TEMP"])/"upstream-release-issue.md"; body=base64.b64decode(os.environ["ISSUE_BODY_BASE64"]).decode("utf-8").replace("{{artifact_url}}", os.environ["ARTIFACT_URL"]); page_url=os.environ.get("PAGE_URL", ""); report_path=os.environ.get("REPORT_PATH", ""); report_url=page_url.rstrip("/")+"/"+report_path if page_url and report_path else ""; body=body.replace("{{report_url}}", report_url); body=body.replace("- [在线查看完整报告]()\n", "") if not report_url else body; p.write_text(body, encoding="utf-8")'
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/upstream-release-issue.md"
      - name: Mark Pages deployment failure
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::error::The report Artifact and Issue were created, but the Pages deployment failed. See the deployment logs."
          exit 1

  schedule-next:
    needs: [watch, publish-report]
    if: ${{ always() && vars.RELEASE_POLL_COOLDOWN_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    environment: release-poll-cooldown
    steps:
      - name: Dispatch the next review
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run watch-releases.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"
