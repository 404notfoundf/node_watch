# API 地址、模型和提示词可以按仓库用 ai: 覆盖。密钥统一从 GitHub Secret AI_API_KEY 读取。
ai:
  api_url: "https://token-plan-sgp.xiaomimimo.com/v1"
  model: "mimo-v2.6-pro"
  diff_chunk_chars: 400000
  prompt: |
    用简体中文审查本次 GitHub Release 的发行说明和已提供的变更材料。
    先对照比较起点与目标 tag，证明本次改动造成的具体行为差异。代码结论必须引用目标差异或已验证且已合并到目标 tag 的代码，并追踪实际调用路径；基线已存在的问题、不受支持的输入/流程、PR/Issue 标题或描述本身，都不能作为本次新增回归的证据。无法证明因果链时不要确认，也不要推断所有请求、节点或数据都会受影响。
    只报告实质影响矿工或节点运行的变更：共识、破坏性变更、兼容性、安全、内存泄漏或 OOM、崩溃、稳定性、数据完整性和迁移。同一根因只归入最具体的类别；只有证明了不同后果时才使用多个类别。
    “共识变更”仅用于最终有效区块/交易规则或可提交到链上的区块集合发生变化。若新检查只提前拒绝完整验证本来就会拒绝的无效头/body，不算共识变更；同步、存储、bad_blocks、封禁或错误处理路径变化本身也不算。
    代码导致破坏性变更，必须证明受支持的升级、迁移、恢复、运行或客户端/API流程在比较起点可用、目标版本因本次改动而失效，并说明具体后果。明确的“⚠️ Breaking Changes”“Breaking Changes”或“Breaking Notes”章节可确认上游作出了重大变更声明，但不能单独证明代码影响或升级后果；只在发行说明确有该章节标题时使用这些英文标签。
    硬分叉激活高度、升级截止时间或旧节点会分叉离网的明确声明，必须作为紧急提醒置于摘要开头。待验证只用于发行说明明确声称了重大影响、但代码和已验证的历史/PR差异仍无法确认的事项；引用原文并简短说明缺少的证据。不要把推测或轻微改动标为待验证。
    忽略常规重构、文档、测试、普通依赖更新和低影响修复。每项发现控制在一两句话并引用具体证据；没有重大事项时写：“未发现需要单独报告的重大变更。”

# auto：预发布版和正式版统一按风险信号选择审查模式。
review:
  mode: auto
  max_releases_per_run: 3 # 每轮最多审查的新 Release 数；剩余版本在下一轮继续。

# 每个币种配置一个仓库。running_version 表示矿池当前运行的 GitHub Release；只分析之后的新版本。
# coins:
#   tari:
#     repo: tari-project/tari
#     running_version: v6.4.0
#     # 可选：仅覆盖此仓库的 API 地址、模型或提示词；仍共用 AI_API_KEY。
#     # ai:
#     #   model: your-model
#     #   prompt: ...
coins:
  tari:
    repo: tari-project/tari
    running_version: v6.2.0-pre.2
