# API 地址、模型和提示词可以按仓库用 ai: 覆盖。密钥统一从 GitHub Secret AI_API_KEY 读取。
ai:
  api_url: "https://token-plan-sgp.xiaomimimo.com/v1"
  model: "mimo-v2.6-pro"
  diff_chunk_chars: 400000
  prompt: |
    用简体中文审查这次 GitHub Release 的发行说明和两个 Release tag 之间的代码变化。
    按系统指定格式输出风险级别、重点标记和重点标记依据。每个非“无”的标记都要说明
    对应的发行说明声明或代码证据。
    只列出会实质影响矿工、节点运行、共识、兼容性、安全、内存、稳定性或数据的变更；
    忽略常规重构、文档、测试、普通依赖更新和低影响修复。每条发现控制在一两句话，
    没有重大事项时明确写“未发现需要单独报告的重大变更”。
    大型差异会分段审查，最后统一汇总；合并各段发现并去重。只有发行说明明确提及的类别
    且代码差异无法核实时才标“待验证”。未提供代码的发行说明声明要简短列出，不要推测后果。
    重要发现必须引用已提供差异中的直接证据；没有重大问题时明确说明。

# 每个币种配置一个仓库。from_release 表示从这个 GitHub Release 开始分析，包含该版本。
# coins:
#   tari:
#     repo: tari-project/tari
#     from_release: v6.4.0
#     # 可选：仅覆盖此仓库的 API 地址、模型或提示词；仍共用 AI_API_KEY。
#     # ai:
#     #   model: your-model
#     #   prompt: ...
coins:
  tari:
    repo: tari-project/tari
    from_release: v6.2.0-pre.2
