# API 地址、模型和提示词可以按仓库用 ai: 覆盖。密钥统一从 GitHub Secret AI_API_KEY 读取。
ai:
  api_url: "https://token-plan-sgp.xiaomimimo.com/v1"
  model: "mimo-v2.6-pro"
  diff_chunk_chars: 400000
  prompt: |
    用简体中文审查本次 GitHub Release 的发行说明和已提供的变更材料。
    只报告会实质影响矿工或节点运行的变更：硬分叉或共识、破坏性变更、
    兼容性、安全、内存泄漏或 OOM、崩溃、稳定性、数据完整性和迁移。
    Release Notes 中明确的“⚠️ Breaking Changes”“Breaking Changes”或“Breaking Notes”章节本身就是上游确认的高优先级破坏性变更声明，不能仅因当前 tag 的代码差异未包含实现而降为普通兼容性提示；若代码影响尚未核实，标记“破坏性变更=待验证”，并说明发行说明已明确标注、代码影响待核实。此时优先级来自上游明确标记，不要仅凭标题夸大风险级别或推断具体升级后果。
    发行说明若明确声明硬分叉及激活区块高度，尤其要求节点在该高度前升级或说明旧版本会分叉离网，必须作为最高优先级紧急提醒置于摘要开头，写明激活高度和升级时限。代码差异未确认时仍标记“硬分叉/共识=待验证”，但不得因此弱化或隐藏上游的紧急升级警告。
    只有代码证据确认改动破坏了仍受支持的升级、迁移、恢复、运行或客户端/API路径，且造成必须运维操作、功能不可用或现有数据无法读取/恢复等实质后果，才标记“破坏性变更=已确认”；依据必须写明受影响的支持路径/版本、改动前后行为及具体后果，缺少其中任何一项都不能确认。
    没有上述明确章节时，若仅影响已淘汰/不受支持的只读工具、可选新格式或不受支持的降级路径，不标记为破坏性变更。支持范围或影响不清时，仅在发行说明明确声称会实质影响矿工、节点运维或受支持的数据恢复/互操作路径时标记“兼容性=待验证”；否则略过。格式不兼容本身不代表高风险。
    每项重要发现必须引用已提供材料中的具体文件、函数、行为或发行说明原文；
    不要推测未提供代码的后果。发行说明提到重大事项但材料无法确认时，按上述分类门槛标记待验证；明确 Breaking Changes 章节本身可确认上游已作重大声明，但不能据此推断具体代码后果或升级影响。
    忽略常规重构、文档、测试、普通依赖更新和低影响修复。
    每项发现控制在一两句话；没有重大事项时写：
    “未发现需要单独报告的重大变更。”

# auto：预发布版和正式版统一按风险信号选择审查模式。
review:
  mode: auto
  max_releases_per_run: 3 # 每轮最多审查的新 Release 数；剩余版本在下一轮继续。

# 每个币种配置一个仓库。running_version 表示矿池当前运行的 GitHub Release；只分析之后的新版本。
# coins:
#   tari:
#     repo: tari-project/tari
#     running_version: v6.4.0
#     # 可选：仅覆盖此仓库的 API 地址、模型或提示词；仍共用 AI_API_KEY。
#     # ai:
#     #   model: your-model
#     #   prompt: ...
coins:
  tari:
    repo: tari-project/tari
    running_version: v6.2.0-pre.2
