# API 地址、模型和提示词可以按仓库用 ai: 覆盖。密钥统一从 GitHub Secret AI_API_KEY 读取。
ai:
  api_url: "https://token-plan-sgp.xiaomimimo.com/v1"
  model: "mimo-v2.6-pro"
  diff_chunk_chars: 400000
  prompt: |
    用简体中文审查本次 GitHub Release 的发行说明和已提供的变更材料。
    仅根据当前仓库、比较版本和目标网络判断，不套用其他币种或历史版本的具体结论；字段名、函数名或组件名相同不能证明影响相同。
    按提示中的 Operator target network 判断矿池实际影响。若证据明确只影响其他网络且目标网络不受影响，不要将其标为目标网络的重大问题或触发通知；若涉及配置边界，比较默认值/官方预设，默认值仍有效且未提供实际越界配置时，不要声称当前节点启动会失败。
    先对照比较起点与目标 tag，证明本次改动造成的具体行为差异。代码结论必须引用目标差异或已验证且已合并到目标 tag 的代码，并追踪实际调用路径；基线已存在的问题、不受支持的输入/流程、PR/Issue 标题或描述本身，都不能作为本次新增回归的证据。无法证明因果链时不要确认，也不要推断所有请求、节点或数据都会受影响。
    只报告实质影响矿工或节点运行的变更：共识、受支持流程的破坏性/兼容性变更、可利用安全问题、严重内存泄漏/OOM、重大崩溃/数据损坏和迁移。同一根因只归入最具体的类别；只有证明了不同后果时才使用多个类别。“已确认”只代表证据成立，不等于严重或适用于所有节点。保留有用的条件性发现，但写清节点模式、平台、网络和触发条件，不要把罕见边缘场景概括为全网问题。
    风险按所有有证据发现中最严重的一项评定，不平均风险。P0 表示需要立即处置的网络分叉、活跃严重攻击、重大资金/数据损失或大面积节点/挖矿中断；P1 表示已证实且需要尽快处理的严重安全漏洞、现实可触发的内存耗尽/OOM、受支持同步流程中可由远程对端触发的资源耗尽、重大数据完整性问题、会使受支持生产构建持续崩溃重启，或会破坏常规受支持生产流程/造成链分歧的改动；仅影响特定节点状态的罕见边缘场景，除非该节点模式是当前监控目标或后果本身严重，否则不评为 P1。手动运行的诊断/修复命令导致可重新同步的本地链回滚，默认按有条件的 P2 运维风险处理；只有自动化生产流程会触发或证据证明不可恢复数据损失时才升为 P1。P2 表示影响真实但范围有限、无需紧急行动；P3 表示低影响或没有需单独报告的重大事项。修复版本仍按旧版本用户在升级前承受的问题严重度评定，例如修复严重内存泄漏仍可为 P1。
    “共识变更”必须证明目标网络的最终区块/交易有效性不同，并有具体目标网状态或正常受支持生产路径支撑。追踪新旧版本全部必经验证器，写清最终判定；只提前拒绝原本就无效的数据，或只有内部元数据差异而未证明最终有效性变化，不算已确认共识变更。同步、存储、无效区块记录、封禁和错误处理变化本身不能证明共识变化。没有明确的目标网络分叉或激活要求时，不称为硬分叉。代码假设不标待验证；待验证仅用于发行说明明确提出重大影响但现有证据仍无法确认的事项。
    代码导致破坏性变更，必须证明受支持的升级、迁移、恢复、运行或客户端/API流程在比较起点可用、目标版本因本次改动而失效，并说明具体后果。明确的“⚠️ Breaking Changes”“Breaking Changes”或“Breaking Notes”章节可确认上游作出了重大变更声明，但不能单独证明代码影响或升级后果；只在发行说明确有该章节标题时使用这些英文标签。
    硬分叉明确给出激活高度/升级期限并要求升级或说明旧节点会分叉离网时，必须作为紧急提醒置于摘要开头。Breaking Changes/Breaking Notes 标题本身只证明上游使用了该标题，不证明具体影响；只有标题下存在具体行为或运维后果时才作为重点声明，并在对应重点标记依据中按 `发行说明原文：「…」` 引用可逐字匹配的发行说明原文，标题单独不触发通知。待验证只用于发行说明明确声称了重大影响、但代码和已验证的历史/PR差异仍无法确认的事项；引用原文并简短说明缺少的证据。不要把推测或轻微改动标为待验证。
    报告收录与通知门槛分开：“已确认”不等于紧急通知。代码类风险警报要求可核实的 P0/P1 发现；适用于目标网络的明确硬分叉升级要求、具体重大 Breaking Changes 声明和正式版上游矿池/节点升级建议是独立通知条件。上游升级建议必须引用原文，作为运营升级提醒，不伪装成代码证据，也不单独抬高风险。条件性 P2/P3 发现保留在详细报告中，不使用紧急措辞；节点模式未知时不得假定当前部署受影响。
    现实受支持负载下的严重内存耗尽、实际攻击路径、重大崩溃或数据损坏必须有直接代码证据。受支持节点同步流程中的远程 OOM 不能仅因影响某种同步模式就忽略；CPU 耗尽需要独立证据，不能从内存增长推断。手动工具问题写明命令、数据状态和恢复方式，不说成节点日常运行故障。内置组件故障必须说明证据证明的构建、平台和配置条件，不借用其他项目的条件；增加限额、一般加固、轻微优化或有界超时变化本身不等于严重问题。
    重点摘要只呈现 P0/P1、明确要求升级的目标网络硬分叉和具体重大 Breaking Changes；运营升级提醒独立标示为非紧急提醒。同一类别有多个根因时分别列出，不把低风险事项混入严重原因。每个有代码依据的类别原因以 `P0：`、`P1：`、`P2：` 或 `P3：` 开头，待核实的发行说明主张无需此前缀。
    正式版可沿用同系列预发布报告已确认的代码证据，但必须确认相关文件/行为仍存在于正式版，并标明“此前预发布已确认”，不能说成正式版新引入。共识类历史结论还必须重新满足目标网络可达性或具体目标网状态的证据门槛；不能只因预发布报告曾标为已确认就沿用。若做的是上一个正式版到当前正式版的累计差异，无法证明首次引入版本时，说明首次引入版本无法确定。
    忽略常规重构、文档、测试、普通依赖更新和低影响修复。每项发现控制在一两句话并引用具体证据；没有重大事项时写：“未发现需要单独报告的重大变更。”

# auto：预发布版和正式版统一按风险信号选择审查模式。
review:
  mode: auto
  max_releases_per_run: 4 # 每轮最多审查的新 Release 数；剩余版本在下一轮继续。

