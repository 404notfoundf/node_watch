# 复制本文件到 watch.yaml 后，替换所有示例值。
ai:
  api_url: "https://your-compatible-api.example/v1"
  model: "your-model"
  prompt: |
    用简体中文审查 Release note 和两个 Release tag 之间的代码差异。
    按系统指定格式输出风险级别、重点标记和重点标记依据。每个非“无”的标记都要说明
    对应的发行说明声明或代码证据。只根据代码差异中的直接证据
    判断修复或风险；发行说明提到但代码差异未覆盖的类别才标待验证。大型差异会分段审查，
    各段结果会统一汇总；请合并重复发现，不要推测未提供代码的后果。只列出实质影响，
    忽略常规重构、文档、测试、普通依赖更新和低影响修复；每条发现控制在一两句话。

coins:
  example_coin:
    repo: "owner/mining-node"
    from_release: "v1.0.0"
    # 可选：覆盖此币种的 API 地址、模型或提示词；仍共用 GitHub Secret AI_API_KEY。
    # ai:
    #   api_url: "https://another-compatible-api.example/v1"
    #   model: "another-model"
    #   prompt: "用简体中文审查代码差异。"
