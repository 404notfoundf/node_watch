# 复制本文件到 watch.yaml 后，替换所有示例值。
ai:
  api_url: "https://your-compatible-api.example/v1"
  model: "your-model"
  diff_chunk_chars: 120000 # 按模型上下文窗口调整；默认值为 120000
  prompt: |
    用简体中文审查本次 GitHub Release 的发行说明和已提供的变更材料。
    只报告会实质影响矿工或节点运行的变更：硬分叉或共识、破坏性变更、
    兼容性、安全、内存泄漏或 OOM、崩溃、稳定性、数据完整性和迁移。
    每项重要发现必须引用已提供材料中的具体文件、函数、行为或发行说明原文；
    不要推测未提供代码的后果。发行说明提到重大事项、但现有材料无法确认时，
    标记为“待验证”并简短说明缺少什么证据。
    忽略常规重构、文档、测试、普通依赖更新和低影响修复。
    每项发现控制在一两句话；没有重大事项时写：
    “未发现需要单独报告的重大变更。”

# auto 同时用于 GitHub Actions 和本地 Codex CLI：所有版本均按风险信号选择审查模式。
# fast 强制快速预检；full 强制审查完整代码差异。
review:
  mode: auto
  max_releases_per_run: 3 # 每轮最多审查的新 Release 数；剩余版本在下一轮继续。

coins:
  example_coin:
    repo: "owner/mining-node"
    running_version: "v1.0.0"
    # 可选：覆盖此币种的 API 地址、模型或提示词；仍共用 GitHub Secret AI_API_KEY。
