# 复制本文件到 watch.yaml 后，替换所有示例值。
ai:
  api_url: "https://your-compatible-api.example/v1"
  model: "your-model"
  diff_chunk_chars: 120000 # 按模型上下文窗口调整；默认值为 120000
  prompt: |
    用简体中文审查本次 GitHub Release 的发行说明和已提供的变更材料。
    仅根据当前仓库、比较版本和目标网络判断，不套用其他币种或历史版本的具体结论；字段名、函数名或组件名相同不能证明影响相同。
    先对照比较起点与目标 tag，确认本次改动造成的行为差异；基线已存在的问题、
    不受支持的输入、PR/Issue 标题或描述不能单独作为本次回归的证据。
    “共识变更”仅指最终有效区块/交易规则发生变化；若改动只提前拒绝完整验证
    本来就会拒绝的无效数据，不算共识变更。
    “破坏性变更”必须证明受支持的流程在比较起点可用、目标版本因本次改动而失效。
    风险按最严重的有证据发现评定：P0 表示需立即处置的分叉、活跃严重攻击、重大资金/数据损失或大面积节点/挖矿中断；
    P1 表示需尽快处理的严重安全、现实内存耗尽/OOM、重大数据完整性或受支持生产流程问题；P2 为真实但有限的影响，P3 为低影响。
    修复版本也按旧版本用户升级前承受的问题评估，例如严重内存泄漏修复仍可为 P1。
    内存和安全类别只标记有实际运行影响或攻击路径的重大问题；普通优化和一般安全加固不算。
    同一根因归入最具体的类别，只有独立后果均有证据时才重复分类。
    代码发现必须引用本次差异里的精确文件路径，并说明实际调用和行为影响。
    Breaking Changes 标题本身不证明影响；若标题下有具体影响，须在对应重点标记依据中按 `发行说明原文：「…」` 引用可逐字匹配的原文。
    按提示中的 Operator target network 判断影响范围；其他网络的变更不能冒充目标网络风险。配置边界收紧要对照默认值和官方预设，默认值仍在范围内且未提供实际越界配置时，不要断言当前节点无法启动。
    正式版缺少同系列预发布审查或预发布审查仍有重大待核实项时，从上一个正式版做完整差异审查；不能确定变化首次进入哪个版本时明确说明未知。
    代码类风险警报必须有可核实的 P0/P1 代码证据。适用于目标网络的硬分叉升级要求、具体重大 Breaking Changes 原文和正式版上游矿池/节点升级建议是独立通知条件；上游建议引用原文并标为运营升级提醒，不单独抬高风险。
    每项结论引用代码差异或发行说明原文，不推测未提供代码的后果；待验证仅用于
    发行说明明确声称重大影响、但代码证据仍无法确认的事项。忽略低影响改动。
    正式版可沿用同系列预发布版已确认的证据，但要确认目标版仍包含对应行为并标为此前已确认；累计差异不能证明首次引入版本时，应明确说明无法确定。
    每项发现控制在一两句话；没有重大事项时写：“未发现需要单独报告的重大变更。”

# auto 同时用于 GitHub Actions 和本地 Codex CLI：所有版本均按风险信号选择审查模式。
# fast 强制快速预检；full 强制审查完整代码差异。
review:
  mode: auto
  max_releases_per_run: 3 # 每轮最多审查的新 Release 数；剩余版本在下一轮继续。
  fast_batch_size: 3 # 最多合并 3 个低风险快速预检；异常时自动逐版本重审。

coins:
  example_coin:
    repo: "owner/mining-node"
    running_version: "v1.0.0"
    network: "mainnet" # 设为该币种矿池实际运行的网络；未知时可省略，但 AI 不会假定主网。
    # include_prereleases: false # 可选：跳过 pre/rc/test/testnet 等预发布版本。
    # 可选：仅覆盖此币种；prompt 替换全局自定义提示词，内置审核保护仍保留。
    # 项目专项要求应依据当前仓库证据，不填写其他项目或旧版本的固定结论。
